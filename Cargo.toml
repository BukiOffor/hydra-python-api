[package]
name = "iop-python"
version = "0.2.1"
edition = "2021"

[lib]
name = "iop_python"
crate-type = ["cdylib"]  # Remove "lib" as it's not needed for Python extensions

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }
iop-sdk = "0.0.16"
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
json-digest = "0.0.16"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"